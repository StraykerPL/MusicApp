name: strayker_media_store
description: In-repository Android MediaStore adapter for Strayker Music.
version: 0.0.1
publish_to: none

environment:
  sdk: '>=3.4.1 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: pl.straykersoftware.strayker_media_store
        pluginClass: StraykerMediaStorePlugin
